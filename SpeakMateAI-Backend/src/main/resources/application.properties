spring.application.name=SpeakMateAI

# ===============================
# SERVER
# ===============================

server.port=${PORT:9091}
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# ===============================
# POSTGRESQL CONNECTION (NEON CLOUD DIRECT)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-summer-boat-azuqu2ws-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&connectTimeout=10&socketTimeout=20&tcpKeepAlive=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_9lzbmdIswDx7}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Optimization for Neon Free Tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# ===============================
# BACKGROUND SCHEDULER TOGGLE
# Disabled on local developer laptops, enabled in production
# ===============================
app.scheduling.enabled=${ENABLE_SCHEDULING:false}

# ===============================
# AUTH / SECURITY
# ===============================
jwt.secret=${JWT_SECRET:SpeakMateAISecretKeyForJWTAuthentication2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# AI SERVICES (GROQ)
# ===============================
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.model.chat=${GROQ_MODEL_CHAT:openai/gpt-oss-120b}
groq.model.analysis=${GROQ_MODEL_ANALYSIS:qwen/qwen3.6-27b}
groq.whisper.url=https://api.groq.com/openai/v1/audio/transcriptions
groq.whisper.model=whisper-large-v3-turbo

# ===============================
# MAIL / SMTP CONFIGURATION (GMAIL PORT 465 SSL)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.connectiontimeout=5000
spring.mail.properties.mail.timeout=5000
spring.mail.properties.mail.writetimeout=5000

# ===============================
# EMAIL PROVIDER SELECTION (BREVO / SMTP)
# ===============================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
brevo.enabled=${BREVO_ENABLED:false}
app.email.provider=${APP_EMAIL_PROVIDER:smtp}
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3}
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:dnyaneshwaralgule2003@gmail.com}
brevo.sender.name=${BREVO_SENDER_NAME:SpeakMateAI}

# ===============================
# RAZORPAY PAYMENT GATEWAY
# ===============================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
